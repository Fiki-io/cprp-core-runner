name: Compile CPRP Core Runner

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-box86-arm32:
    name: Build Box86 (armeabi-v7a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Build Shared Library (armeabi-v7a)
        run: |
          mkdir -p build-arm32
          cd build-arm32
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_ARM_MODE=arm \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID=ON \
            -DARM_DYNAREC=ON \
            -DBOX86LIB=ON \
            -DBOX86DYNAMIC=ON \
            -DHAVE_TRACE=OFF \
            -DNOLOADADDR=ON \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          ls -la

      - name: Collect Artifacts
        run: |
          mkdir -p output/armeabi-v7a
          find build-arm32 -name "*.so" -exec cp {} output/armeabi-v7a/ \; || true
          ls -la output/armeabi-v7a/

      - name: Upload Core Artifact (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: core-armeabi-v7a
          path: output/armeabi-v7a/

  build-box64-arm64:
    name: Build Box64 (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Box64
        uses: actions/checkout@v4
        with:
          repository: ptitSeb/box64
          path: box64-src

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Build Box64 Shared Library (arm64-v8a)
        run: |
          mkdir -p box64-build
          cd box64-build
          cmake ../box64-src \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID=ON \
            -DARM64=ON \
            -DDYNAREC=ON \
            -DHAVE_TRACE=OFF \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc) || true
          ls -la

      - name: Collect Artifacts
        run: |
          mkdir -p output/arm64-v8a
          find box64-build -name "*.so" -exec cp {} output/arm64-v8a/ \; || true
          find box64-build -name "box64" -exec cp {} output/arm64-v8a/ \; || true
          ls -la output/arm64-v8a/

      - name: Upload Core Artifact (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: core-arm64-v8a
          path: output/arm64-v8a/
