name: Compile CPRP Core Runner

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-box86:
    name: Build Box86 Core (armeabi-v7a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Build Shared Library
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_ARM_MODE=arm \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID=ON \
            -DARM_DYNAREC=ON \
            -DBOX86LIB=ON \
            -DBOX86DYNAMIC=ON \
            -DHAVE_TRACE=OFF \
            -DNOLOADADDR=ON \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          ls -la

      - name: Collect Artifacts
        run: |
          mkdir -p output/armeabi-v7a
          find build -name "*.so" -exec cp -v {} output/armeabi-v7a/ \; || true
          ls -la output/armeabi-v7a/

      - name: Upload Core Artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-armeabi-v7a
          path: output/armeabi-v7a/
